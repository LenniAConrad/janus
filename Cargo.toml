[workspace]
resolver = "2"
members = [
    "crates/janus-core",
    "crates/janus-engine",
    "crates/janus-uci",
]

[workspace.package]
version = "2026.9.9"
edition = "2021"
rust-version = "1.75"
authors = ["Lennart A. Conrad <lennart.a.conrad@gmail.com>"]
license = "GPL-3.0-only"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
